<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="swissRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Shield Base -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#swissRed)" filter="url(#shadow)" />

  <!-- Shield Inner Border -->
  <rect x="8" y="8" width="48" height="48" rx="12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Swiss Cross / Security Emblem -->
  <!-- Vertical Bar -->
  <rect x="27" y="18" width="10" height="28" rx="3" fill="#ffffff" />
  <!-- Horizontal Bar -->
  <rect x="18" y="27" width="28" height="10" rx="3" fill="#ffffff" />

  <!-- Knife Fold Accent Keyhole -->
  <circle cx="32" cy="32" r="2.5" fill="#e11d48" />
</svg>
